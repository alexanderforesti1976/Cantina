<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>La mia cantina 🍷</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f5;--sur:#fff;--bd:#e5e2db;--tx:#1a1a1a;--mu:#888;
  --pu:#5c3d9e;--pu-bg:#f0ebfc;--pu-bd:#c9b8e8;
  --gr:#2d6a2d;--gr-bg:#f3faf3;--gr-bd:#bfddbf;
  --ch:#185fa5;--ch-bg:#eef5fb;--ch-bd:#b5d4f4;
  --r:10px;--rs:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 100px}

/* HEADER */
.hdr{position:sticky;top:0;background:var(--bg);z-index:50;padding:12px 0 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hdr h1{font-size:21px;font-weight:700;flex:1;min-width:100px}

/* PULSANTI */
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border:none;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none}
.btn-dark{background:#2c2c2a;color:#fff}
.btn-pu{background:var(--pu-bg);color:var(--pu);border:1px solid var(--pu-bd)}
.btn-red{background:#fff0f0;color:#900;border:1px solid #f5c0c0}
.btn-ghost{background:#f0f0f0;color:#444}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--sur);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px}
.stat-l{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.stat-v{font-size:20px;font-weight:700}

/* TOOLBAR */
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tb input,.tb select{height:40px;border:1px solid var(--bd);border-radius:var(--rs);font-size:14px;background:var(--sur);color:var(--tx);outline:none;padding:0 12px;font-family:inherit}
.tb input{flex:1;min-width:130px}

/* PILLS */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:4px 12px;border-radius:99px;font-size:12px;cursor:pointer;border:1px solid var(--bd);background:none;color:var(--mu);font-family:inherit}
.pill.on{background:#2c2c2a;color:#fff;border-color:#2c2c2a}

/* CARDS */
.card{background:var(--sur);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.cname{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:12px;color:var(--mu);margin-top:2px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;border-radius:4px;padding:1px 6px}
.badge-ch{background:var(--ch-bg);color:var(--ch);border:1px solid var(--ch-bd)}
.badge-gr{background:var(--gr-bg);color:var(--gr);border:1px solid var(--gr-bd)}
.ic-btn{background:none;border:none;cursor:pointer;padding:5px;font-size:16px;opacity:.5;-webkit-tap-highlight-color:transparent}

/* FAB */
.fab{position:fixed;bottom:24px;right:20px;width:60px;height:60px;border-radius:50%;background:#2c2c2a;color:#fff;border:none;font-size:32px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:60;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}

/* EMPTY */
.empty{text-align:center;padding:3rem 1rem;color:#bbb;font-size:14px}

/* OVERLAY */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 14px}
.ov.open{display:block}
.panel{background:var(--sur);border-radius:14px;padding:20px;width:100%;max-width:460px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ph h2{font-size:17px;font-weight:700}
.xb{background:none;border:none;font-size:24px;cursor:pointer;color:var(--mu);line-height:1;padding:2px;-webkit-tap-highlight-color:transparent}

/* FORM */
.fr{margin-bottom:12px}
.fr label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.fi{width:100%;height:42px;padding:0 12px;border:1px solid var(--bd);border-radius:var(--rs);font-size:15px;background:var(--sur);color:var(--tx);outline:none;font-family:inherit;-webkit-appearance:none}
.fi:focus{border-color:#666}
textarea.fi{height:64px;padding:10px 12px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* SECTION BOXES */
.sbox{border-radius:var(--rs);padding:14px;margin-bottom:12px}
.sbox .sl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.sch{background:var(--ch-bg);border:1px solid var(--ch-bd)}.sch .sl,.sch label{color:var(--ch)}.sch .fi{border-color:var(--ch-bd)}
.saq{background:var(--gr-bg);border:1px solid var(--gr-bd)}.saq .sl,.saq label{color:var(--gr)}.saq .fi{border-color:var(--gr-bd)}

/* STELLE */
.stars{display:flex;gap:6px;margin-top:4px}
.star{font-size:26px;cursor:pointer;color:#ddd;line-height:1;-webkit-tap-highlight-color:transparent}
.star.on{color:#BA7517}

/* FORM ACTIONS */
.fac{display:flex;gap:10px;margin-top:16px;padding-bottom:10px}
.fac .btn{flex:1;height:48px;font-size:15px}

/* DETTAGLIO */
.drow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f0ede8}
.drow .dl{font-size:13px;color:var(--mu)}
.drow .dv{font-size:14px;font-weight:500;text-align:right;max-width:60%}
.note-box{background:var(--bg);border-radius:var(--rs);padding:12px;font-size:13px;color:#555;margin-top:12px;line-height:1.6}
.det-actions{display:flex;gap:10px;margin-top:20px}
.det-actions .btn{flex:1;height:46px;font-size:14px}

/* CAMERA SHEET */
.cam-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center}
.cam-ov.open{display:flex}
.cam-sheet{background:var(--sur);border-radius:18px 18px 0 0;padding:18px 18px 40px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.cam-bar{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
.cam-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cam-hd h3{font-size:17px;font-weight:700}
.cam-sub{font-size:13px;color:var(--mu);margin-bottom:18px;line-height:1.5}

/* CAMERA BIG BUTTONS */
.cam-pick-btn{display:block;width:100%;margin-bottom:12px;text-decoration:none;cursor:pointer}
.cam-pick-inner{border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.cam-pick-main .cam-pick-inner{background:var(--pu);color:#fff}
.cam-pick-gal .cam-pick-inner{background:var(--pu-bg);color:var(--pu);border:1px solid var(--pu-bd)}
.cam-pick-consume .cam-pick-inner{background:#fff0f0;color:#900;border:1px solid #f5c0c0}
.cam-icon{font-size:32px}
.cam-label{font-size:15px;font-weight:600}
.cam-desc{font-size:11px;opacity:.75;margin-top:2px}

/* ANALISI */
.analyzing{text-align:center;padding:2rem 0}
.spin{width:46px;height:46px;border:3px solid var(--pu-bd);border-top-color:var(--pu);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}

/* RISULTATO */
.result-box{border-radius:12px;padding:14px;margin-bottom:14px}
.result-pu{background:var(--pu-bg);border:1px solid var(--pu-bd)}
.result-red{background:#fff4f4;border:1px solid #f5c0c0}
.result-name{font-size:16px;font-weight:700;margin-bottom:6px}
.result-pu .result-name{color:var(--pu)}
.result-red .result-name{color:#900}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rf{background:var(--sur);border:1px solid var(--pu-bd);border-radius:var(--rs);padding:7px 10px}
.rfl{font-size:10px;text-transform:uppercase;color:var(--pu);letter-spacing:.04em}
.rfv{font-size:13px;font-weight:500;margin-top:1px}
.err-box{background:#fff0f0;border:1px solid #f5c0c0;border-radius:var(--rs);padding:12px;font-size:13px;color:#900;margin-bottom:12px;line-height:1.5}

/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2c2c2a;color:#fff;border-radius:8px;padding:10px 20px;font-size:14px;z-index:999;white-space:nowrap;pointer-events:none}

@media(max-width:400px){.g3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>🍷 La mia cantina</h1>
    <button class="btn btn-red" onclick="aproCam('consume')">🍾 Prelevo</button>
    <button class="btn btn-pu" onclick="aproCam('add')">📷 Foto etichetta</button>
    <button class="btn btn-dark" onclick="apriForm(null)">+ Aggiungi</button>
  <button class="btn btn-ghost" onclick="esporta()" title="Salva dati">💾</button>
  <label for="inp-import" class="btn btn-ghost" style="cursor:pointer" title="Carica dati">📂</label>
  <input type="file" id="inp-import" accept=".json" style="position:fixed;opacity:0;width:1px;height:1px;top:-100px">
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-l">Bottiglie totali</div><div class="stat-v" id="st">0</div></div>
    <div class="stat"><div class="stat-l">Valore cantina</div><div class="stat-v" id="sv" style="font-size:15px">€0,00</div></div>
    <div class="stat"><div class="stat-l">Vini rossi</div><div class="stat-v" id="sr">0</div></div>
    <div class="stat"><div class="stat-l">Champagne</div><div class="stat-v" id="sc">0</div></div>
  </div>

  <div class="tb">
    <input type="text" id="srch" placeholder="🔍 Cerca…" oninput="renderList()">
    <select id="ftipo" onchange="renderList()">
      <option value="">Tutti i tipi</option>
      <option>Rosso</option><option>Bianco</option><option>Rosato</option>
      <option>Bollicine</option><option>Champagne</option><option>Dolce</option>
    </select>
  </div>

  <div class="pills">
    <button class="pill on" onclick="setSort('name',this)">Nome</button>
    <button class="pill" onclick="setSort('anno',this)">Annata</button>
    <button class="pill" onclick="setSort('score',this)">Punteggio</button>
    <button class="pill" onclick="setSort('costo',this)">Costo</button>
    <button class="pill" onclick="setSort('qty',this)">Quantità</button>
  </div>

  <div id="lista"></div>
</div>

<button class="fab" onclick="apriForm(null)">+</button>

<!-- OVERLAY DETTAGLIO -->
<div class="ov" id="ov-det" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="panel"><div id="det-body"></div></div>
</div>

<!-- OVERLAY FORM -->
<div class="ov" id="ov-frm" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="panel">
    <div class="ph"><h2 id="frm-title">Aggiungi bottiglia</h2><button class="xb" onclick="chiudi('ov-frm')">✕</button></div>
    <input type="hidden" id="f-id">
    <div class="fr"><label>Nome vino *</label><input class="fi" type="text" id="f-name" placeholder="es. Barolo Brunate 2018"></div>
    <div class="g2">
      <div class="fr"><label>Cantina</label><input class="fi" type="text" id="f-cantina"></div>
      <div class="fr"><label>Regione / AOC</label><input class="fi" type="text" id="f-regione"></div>
    </div>
    <div class="g3">
      <div class="fr"><label>Tipo</label>
        <select class="fi" id="f-tipo" onchange="togCh()">
          <option>Rosso</option><option>Bianco</option><option>Rosato</option>
          <option>Bollicine</option><option>Champagne</option><option>Dolce</option>
        </select>
      </div>
      <div class="fr"><label>Annata</label><input class="fi" type="number" id="f-anno" placeholder="2019"></div>
      <div class="fr"><label>Bottiglie</label><input class="fi" type="number" id="f-qty" value="1" min="1"></div>
    </div>
    <div class="sbox sch" id="ch-box" style="display:none">
      <div class="sl">🥂 Champagne</div>
      <div class="g2">
        <div class="fr"><label>Sboccatura</label><input class="fi" type="month" id="f-sboc"></div>
        <div class="fr"><label>Dosaggio</label>
          <select class="fi" id="f-dos"><option value="">—</option>
            <option>Brut Nature</option><option>Extra Brut</option><option>Brut</option>
            <option>Extra Dry</option><option>Sec</option><option>Demi-Sec</option><option>Doux</option>
          </select>
        </div>
      </div>
      <div class="g2">
        <div class="fr"><label>Tipologia</label>
          <select class="fi" id="f-cht"><option value="">—</option>
            <option>Non Millésimé</option><option>Millésimé</option><option>Blanc de Blancs</option>
            <option>Blanc de Noirs</option><option>Rosé</option><option>Prestige Cuvée</option>
          </select>
        </div>
        <div class="fr"><label>Statuto</label>
          <select class="fi" id="f-chs"><option value="">—</option>
            <option>NM – Négociant</option><option>RM – Récoltant</option>
            <option>CM – Coopérative</option><option>SR – Soc. Récoltants</option>
          </select>
        </div>
      </div>
    </div>
    <div class="sbox saq">
      <div class="sl">🛒 Acquisto</div>
      <div class="g2">
        <div class="fr"><label>Costo €/bott.</label><input class="fi" type="number" id="f-costo" placeholder="0.00" step="0.01"></div>
        <div class="fr"><label>Data acquisto</label><input class="fi" type="date" id="f-data"></div>
      </div>
      <div class="fr"><label>Acquistato presso</label><input class="fi" type="text" id="f-neg" placeholder="Enoteca, Amazon…"></div>
    </div>
    <div class="fr"><label>Punteggio</label>
      <div class="stars" id="stars">
        <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
        <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
      </div>
    </div>
    <div class="fr"><label>Note</label><textarea class="fi" id="f-note" placeholder="Abbinamenti, impressioni…"></textarea></div>
    <div class="fac">
      <button class="btn btn-ghost" onclick="chiudi('ov-frm')">Annulla</button>
      <button class="btn btn-dark" onclick="salvaVino()">Salva</button>
    </div>
  </div>
</div>

<!-- CAMERA BOTTOM SHEET -->
<div class="cam-ov" id="cam-ov" onclick="if(event.target===this)chiudiCam()">
  <div class="cam-sheet">
    <div class="cam-bar"></div>
    <div class="cam-hd">
      <h3 id="cam-title">📷 Foto etichetta</h3>
      <button class="xb" onclick="chiudiCam()">✕</button>
    </div>
    <div class="cam-sub" id="cam-sub"></div>
    <div id="cam-body"></div>
  </div>
</div>

<script>
const TCOL={Rosso:'#8B1A1A',Bianco:'#C8A84B',Rosato:'#E8748A',Bollicine:'#7AABCC',Champagne:'#185FA5',Dolce:'#8B6BB5'};
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const STORE='cantina_v9';
let vini=[],sortK='name',eStar=0,camMode='add',imgB64=null;

/* ── EXPORT / IMPORT ── */
function esporta(){
  const json=JSON.stringify({vini:vini,data:new Date().toISOString()},null,2);
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(json);
  a.download='cantina_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

/* ── INIT ── */
function init(){
  try{vini=JSON.parse(localStorage.getItem(STORE))||[];}catch{vini=[];}
  aggStats();renderList();
  document.querySelectorAll('#stars .star').forEach(s=>{
    s.onclick=()=>{eStar=parseInt(s.dataset.v);rStars(eStar);};
    s.onmouseover=()=>rStars(parseInt(s.dataset.v));
    s.onmouseout=()=>rStars(eStar);
  });
}
function salva(){localStorage.setItem(STORE,JSON.stringify(vini));}

/* ── UTILS ── */
function qq(w){return Number(w.qty)||1;}
function fS(v){if(!v)return null;const[y,m]=v.split('-');return'Sboc. '+MESI[parseInt(m)-1]+' '+y;}
function fD(d){if(!d)return null;const[y,m,g]=d.split('-');return g+'/'+m+'/'+y;}
function fC(c){if(c==null)return null;return'€'+Number(c).toLocaleString('it-IT',{minimumFractionDigits:2});}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function chiudi(id){document.getElementById(id).classList.remove('open');}

/* ── STATS ── */
function aggStats(){
  document.getElementById('st').textContent=vini.reduce((s,w)=>s+qq(w),0);
  document.getElementById('sr').textContent=vini.filter(w=>w.tipo==='Rosso').reduce((s,w)=>s+qq(w),0);
  document.getElementById('sc').textContent=vini.filter(w=>w.tipo==='Champagne').reduce((s,w)=>s+qq(w),0);
  const v=vini.reduce((s,w)=>s+(Number(w.costo)||0)*qq(w),0);
  document.getElementById('sv').textContent='€'+v.toLocaleString('it-IT',{minimumFractionDigits:2});
}

/* ── SORT ── */
function setSort(k,el){
  sortK=k;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');renderList();
}

/* ── LISTA ── */
function renderList(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const ft=document.getElementById('ftipo').value;
  let list=vini.filter(w=>{
    const m=!q||[w.name,w.cantina,w.regione].some(x=>(x||'').toLowerCase().includes(q));
    return m&&(!ft||w.tipo===ft);
  }).sort((a,b)=>{
    if(sortK==='name')  return(a.name||'').localeCompare(b.name||'','it');
    if(sortK==='anno')  return(Number(b.anno)||0)-(Number(a.anno)||0);
    if(sortK==='score') return(b.score||0)-(a.score||0);
    if(sortK==='costo') return(Number(b.costo)||0)-(Number(a.costo)||0);
    if(sortK==='qty')   return qq(b)-qq(a);
    return 0;
  });
  const el=document.getElementById('lista');
  if(!list.length){
    el.innerHTML='<div class="empty">🍾<br><br>'+(vini.length?'Nessun risultato.':'Cantina vuota — aggiungi la prima bottiglia!')+'</div>';
    return;
  }
  el.innerHTML=list.map(w=>{
    const meta=[w.cantina,w.regione,w.anno].filter(Boolean);
    const sb=w.tipo==='Champagne'&&w.sboc?`<span class="badge badge-ch">${fS(w.sboc)}</span>`:'';
    const cp=w.costo!=null?`<span class="badge badge-gr">${fC(w.costo)}</span>`:'';
    return`<div class="card" onclick="apriDet('${w.id}')">
      <div class="dot" style="background:${TCOL[w.tipo]||'#888'}"></div>
      <div style="flex:1;min-width:0">
        <div class="cname">${w.name}</div>
        <div class="cmeta"><span>${meta.join(' · ')}</span>${sb}${cp}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
        ${w.score?`<span style="color:#BA7517;font-size:12px">${'★'.repeat(w.score)}</span>`:''}
        <span style="font-size:13px;font-weight:600;background:#f0ede8;border-radius:6px;padding:3px 10px">${qq(w)} bott.</span>
        <button class="ic-btn" onclick="event.stopPropagation();apriForm('${w.id}')">✏️</button>
        <button class="ic-btn" onclick="event.stopPropagation();elimina('${w.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

/* ── DETTAGLIO ── */
function apriDet(id){
  const w=vini.find(x=>x.id===id);if(!w)return;
  const st=w.score?'★'.repeat(w.score)+'☆'.repeat(5-w.score):'—';
  const rows=[
    ['Produttore',w.cantina],['Regione',w.regione],
    ['Bottiglie',qq(w)],['Punteggio',st],
    ...(w.tipo==='Champagne'?[['Sboccatura',fS(w.sboc)],['Dosaggio',w.dos],['Tipologia',w.cht],['Statuto',w.chs]]:[]),
    ['Costo/bott.',fC(w.costo)],
    w.costo&&qq(w)>1?['Valore tot.',fC(Number(w.costo)*qq(w))]:null,
    ['Acquistato',w.neg],['Data acquisto',fD(w.data)]
  ].filter(r=>r&&r[1]);
  document.getElementById('det-body').innerHTML=`
    <div class="ph">
      <div>
        <h2 style="font-size:17px;font-weight:700">${w.name}</h2>
        <div style="font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px;margin-top:3px">
          <span style="width:10px;height:10px;border-radius:50%;background:${TCOL[w.tipo]||'#888'};display:inline-block"></span>
          ${w.tipo}${w.anno?' · '+w.anno:''}
        </div>
      </div>
      <button class="xb" onclick="chiudi('ov-det')">✕</button>
    </div>
    ${rows.map(([l,v])=>`<div class="drow"><span class="dl">${l}</span><span class="dv">${v}</span></div>`).join('')}
    ${w.note?`<div class="note-box">${w.note}</div>`:''}
    <div class="det-actions">
      <button class="btn btn-red" onclick="elimina('${w.id}')">Elimina</button>
      <button class="btn btn-ghost" onclick="chiudi('ov-det')">Chiudi</button>
      <button class="btn btn-dark" onclick="chiudi('ov-det');apriForm('${w.id}')">Modifica</button>
    </div>`;
  document.getElementById('ov-det').classList.add('open');
}

/* ── FORM ── */
function togCh(){document.getElementById('ch-box').style.display=document.getElementById('f-tipo').value==='Champagne'?'block':'none';}
function rStars(v){document.querySelectorAll('#stars .star').forEach(s=>s.classList.toggle('on',parseInt(s.dataset.v)<=v));}

function apriForm(id,pre){
  eStar=0;
  document.getElementById('f-id').value=id||'';
  document.getElementById('frm-title').textContent=id?'Modifica bottiglia':'Aggiungi bottiglia';
  const ids=['f-name','f-cantina','f-regione','f-anno','f-note','f-sboc','f-costo','f-neg','f-data'];
  ids.forEach(i=>{const e=document.getElementById(i);if(e)e.value='';});
  document.getElementById('f-tipo').value='Rosso';
  document.getElementById('f-qty').value=1;
  ['f-dos','f-cht','f-chs'].forEach(i=>{const e=document.getElementById(i);if(e)e.value='';});
  const src=id?vini.find(x=>x.id===id):(pre||null);
  if(src){
    const map={name:'f-name',cantina:'f-cantina',regione:'f-regione',anno:'f-anno',
      note:'f-note',sboc:'f-sboc',costo:'f-costo',neg:'f-neg',data:'f-data',
      tipo:'f-tipo',qty:'f-qty',dos:'f-dos',cht:'f-cht',chs:'f-chs'};
    Object.entries(map).forEach(([k,fid])=>{
      if(src[k]!=null&&src[k]!==''){const e=document.getElementById(fid);if(e)e.value=src[k];}
    });
    eStar=src.score||0;
  }
  togCh();rStars(eStar);
  document.getElementById('ov-frm').classList.add('open');
  setTimeout(()=>{const n=document.getElementById('f-name');if(n)n.focus();},100);
}

function salvaVino(){
  const name=(document.getElementById('f-name').value||'').trim();
  if(!name){alert('Inserisci il nome del vino');return;}
  const id=document.getElementById('f-id').value;
  const tipo=document.getElementById('f-tipo').value;
  const w={
    id:id||Date.now().toString(),name,
    cantina:(document.getElementById('f-cantina').value||'').trim(),
    regione:(document.getElementById('f-regione').value||'').trim(),
    tipo,anno:parseInt(document.getElementById('f-anno').value)||null,
    qty:parseInt(document.getElementById('f-qty').value)||1,
    score:eStar,
    note:(document.getElementById('f-note').value||'').trim(),
    costo:document.getElementById('f-costo').value!==''?parseFloat(document.getElementById('f-costo').value):null,
    neg:(document.getElementById('f-neg').value||'').trim(),
    data:document.getElementById('f-data').value||''
  };
  if(tipo==='Champagne'){
    w.sboc=document.getElementById('f-sboc').value||'';
    w.dos=document.getElementById('f-dos').value||'';
    w.cht=document.getElementById('f-cht').value||'';
    w.chs=document.getElementById('f-chs').value||'';
  }
  if(id){const i=vini.findIndex(x=>x.id===id);if(i>=0)vini[i]=w;}
  else vini.push(w);
  salva();aggStats();renderList();chiudi('ov-frm');
  toast('✅ Bottiglia salvata');
}

function elimina(id){
  if(!confirm('Rimuovere questa bottiglia?'))return;
  vini=vini.filter(x=>x.id!==id);
  salva();aggStats();renderList();chiudi('ov-det');
  toast('🗑️ Bottiglia rimossa');
}

/* ── CAMERA ── */
function aproCam(mode){
  camMode=mode;imgB64=null;imgB64b=null;
  document.getElementById('cam-title').textContent=mode==='consume'?'🍾 Prelevo una bottiglia':'📷 Foto etichetta';
  document.getElementById('cam-sub').textContent=mode==='consume'
    ?'Fotografa l\'etichetta — la bottiglia verrà scalata automaticamente'
    :'Fotografa l\'etichetta — l\'AI compila tutti i campi automaticamente';
  mostraPick();
  document.getElementById('cam-ov').classList.add('open');
}

function chiudiCam(){document.getElementById('cam-ov').classList.remove('open');}

// imgB64 = etichetta anteriore, imgB64b = etichetta posteriore
let imgB64b=null;

function mostraPick(){
  document.getElementById('cam-body').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div id="thumb-a" style="background:#f0ebfc;border:2px dashed #c9b8e8;border-radius:10px;height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:12px;color:#5c3d9e">
        <span style="font-size:24px">📷</span>Anteriore
      </div>
      <div id="thumb-b" style="background:#f0f0f0;border:2px dashed #ddd;border-radius:10px;height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:12px;color:#888">
        <span style="font-size:24px">📷</span>Posteriore
      </div>
    </div>
    <label for="inp-cam-a" class="cam-pick-btn cam-pick-main">
      <div class="cam-pick-inner">
        <span class="cam-icon">📸</span>
        <div><div class="cam-label">Etichetta anteriore</div><div class="cam-desc">Scatta o scegli la foto frontale</div></div>
      </div>
    </label>
    <input type="file" id="inp-cam-a" accept="image/*" capture="environment" style="position:fixed;opacity:0;width:1px;height:1px;top:-100px">
    <label for="inp-gal-a" class="cam-pick-btn cam-pick-gal" style="margin-bottom:16px">
      <div class="cam-pick-inner" style="padding:10px 18px">
        <span class="cam-icon" style="font-size:22px">🖼️</span>
        <div><div class="cam-label" style="font-size:13px">Dalla galleria (anteriore)</div></div>
      </div>
    </label>
    <input type="file" id="inp-gal-a" accept="image/*" style="position:fixed;opacity:0;width:1px;height:1px;top:-100px">
    <div style="border-top:1px solid #eee;margin-bottom:14px"></div>
    <label for="inp-cam-b" class="cam-pick-btn" style="margin-bottom:10px">
      <div class="cam-pick-inner" style="background:#f8f7f5;border:1px solid #ddd;border-radius:12px;padding:14px 18px">
        <span class="cam-icon">📸</span>
        <div><div class="cam-label" style="color:#444">Etichetta posteriore</div><div class="cam-desc" style="color:#888">Opzionale — uvaggio, gradi, note</div></div>
      </div>
    </label>
    <input type="file" id="inp-cam-b" accept="image/*" capture="environment" style="position:fixed;opacity:0;width:1px;height:1px;top:-100px">
    <label for="inp-gal-b" class="cam-pick-btn">
      <div class="cam-pick-inner" style="background:#f8f7f5;border:1px solid #ddd;border-radius:12px;padding:10px 18px">
        <span class="cam-icon" style="font-size:22px">🖼️</span>
        <div><div class="cam-label" style="font-size:13px;color:#444">Dalla galleria (posteriore)</div></div>
      </div>
    </label>
    <input type="file" id="inp-gal-b" accept="image/*" style="position:fixed;opacity:0;width:1px;height:1px;top:-100px">
    <div id="btn-analizza-wrap" style="margin-top:14px;display:none">
      <button class="btn btn-pu" style="width:100%;height:48px;font-size:15px" onclick="avviaAnalisi()">🤖 Analizza etichette</button>
    </div>`;

  // Anteriore
  ['inp-cam-a','inp-gal-a'].forEach(id=>{
    document.getElementById(id).onchange=e=>{
      if(!e.target.files[0])return;
      const r=new FileReader();
      r.onload=ev=>{
        comprimi(ev.target.result, b64=>{
          imgB64=b64;
          document.getElementById('thumb-a').innerHTML='<img src="data:image/jpeg;base64,'+b64+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">';
          document.getElementById('thumb-a').style.border='2px solid #5c3d9e';
          aggiornaBottoneAnalisi();
        });
      };
      r.readAsDataURL(e.target.files[0]);
    };
  });

  // Posteriore
  ['inp-cam-b','inp-gal-b'].forEach(id=>{
    document.getElementById(id).onchange=e=>{
      if(!e.target.files[0])return;
      const r=new FileReader();
      r.onload=ev=>{
        comprimi(ev.target.result, b64=>{
          imgB64b=b64;
          document.getElementById('thumb-b').innerHTML='<img src="data:image/jpeg;base64,'+b64+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">';
          document.getElementById('thumb-b').style.border='2px solid #2d6a2d';
          aggiornaBottoneAnalisi();
        });
      };
      r.readAsDataURL(e.target.files[0]);
    };
  });
}

function aggiornaBottoneAnalisi(){
  if(imgB64){
    document.getElementById('btn-analizza-wrap').style.display='block';
  }
}

function avviaAnalisi(){
  mostraAnalisi();
  chiamaAPI();
}



function mostraAnalisi(){
  document.getElementById('cam-body').innerHTML=`
    <div class="analyzing">
      <div class="spin"></div>
      <div style="font-size:15px;color:var(--mu)">Lettura etichetta in corso…</div>
      <div style="font-size:12px;color:#bbb;margin-top:6px">L'AI sta analizzando l'etichetta</div>
    </div>`;
}

function comprimi(dataUrl, cb){
  const img=new Image();
  img.onload=function(){
    const MAX=1400;let w=img.width,h=img.height;
    if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
    const c=document.createElement('canvas');
    c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    let q=0.82,res=c.toDataURL('image/jpeg',q);
    while(res.length*0.75>8000000&&q>0.3){q-=0.1;res=c.toDataURL('image/jpeg',q);}
    const b64=res.split(',')[1];
    if(cb)cb(b64); else{imgB64=b64;chiamaAPI();}
  };
  img.src=dataUrl;
}

async function chiamaAPI(){
  const k=localStorage.getItem('apiKey')||'';
  if(!k){
    document.getElementById('cam-body').innerHTML=`
      <div class="err-box">⚠️ Chiave API non trovata.<br>Vai su <strong>console.anthropic.com</strong> → API Keys → Create Key<br>poi incollala nel campo in fondo alla pagina.</div>
      <button class="btn btn-ghost" style="width:100%;height:46px;font-size:14px;margin-top:8px" onclick="mostraPick()">← Torna indietro</button>`;
    return;
  }
  const isC=camMode==='consume';
  const p=isC
    ?'Analizza questa etichetta di vino. Rispondi SOLO con JSON valido senza markdown:\n{"nome":"nome vino","cantina":"produttore","tipo":"Rosso|Bianco|Rosato|Bollicine|Champagne|Dolce","anno":2018}'
    :'Sei un sommelier esperto. Analizza queste etichette di vino (anteriore e posteriore se presente). Rispondi SOLO con JSON valido senza markdown:\n{"nome":"nome completo","cantina":"produttore","regione":"denominazione es Barolo DOCG","tipo":"Rosso|Bianco|Rosato|Bollicine|Champagne|Dolce","anno":2018,"dos":"dosaggio solo se Champagne","cht":"tipologia solo se Champagne","note":"uvaggi gradi alcol e altre info dall etichetta posteriore","conf":"alta|media|bassa"}';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-4-5',max_tokens:500,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:imgB64}},
          ...(imgB64b?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:imgB64b}}]:[]),
          {type:'text',text:p}
        ]}]
      })
    });
    const d=await res.json();
    if(d.error)throw new Error(d.error.message);
    const parsed=JSON.parse(d.content[0].text.replace(/```[\w]*|```/g,'').trim());
    if(isC)mostraRisConsumo(parsed);else mostraRisAgg(parsed);
  }catch(e){
    document.getElementById('cam-body').innerHTML=`
      <div class="err-box">❌ ${e.message}</div>
      <button class="btn btn-ghost" style="width:100%;height:46px;font-size:14px;margin-top:8px" onclick="mostraPick()">← Riprova</button>`;
  }
}

function mostraRisAgg(d){
  const TIPI=['Rosso','Bianco','Rosato','Bollicine','Champagne','Dolce'];
  window._ris=d;
  const fields=[['Nome',d.nome],['Cantina',d.cantina],['Regione',d.regione],['Tipo',d.tipo],['Annata',d.anno],
    ...(d.tipo==='Champagne'?[['Dosaggio',d.dos],['Tipologia',d.cht]]:[])].filter(([,v])=>v);
  document.getElementById('cam-body').innerHTML=`
    <div class="result-box result-pu">
      <div class="result-name">${d.nome||'—'}</div>
      ${d.conf==='bassa'?'<div style="font-size:12px;color:#b87000;margin-bottom:6px">⚠️ Lettura incerta — verifica prima di salvare</div>':''}
      <div class="result-grid">${fields.map(([l,v])=>`<div class="rf"><div class="rfl">${l}</div><div class="rfv">${v}</div></div>`).join('')}</div>
      ${d.note?`<div style="font-size:12px;color:var(--mu);margin-top:8px">${d.note}</div>`:''}
    </div>
    <button class="btn btn-pu" style="width:100%;height:48px;font-size:15px;margin-bottom:10px" onclick="usaRis()">✅ Aggiungi alla cantina</button>
    <button class="btn btn-ghost" style="width:100%;height:42px;font-size:14px" onclick="mostraPick()">📷 Riprova con un'altra foto</button>`;
}

function usaRis(){
  const d=window._ris;if(!d)return;
  const TIPI=['Rosso','Bianco','Rosato','Bollicine','Champagne','Dolce'];
  chiudiCam();
  setTimeout(()=>apriForm(null,{
    name:d.nome||'',cantina:d.cantina||'',regione:d.regione||'',
    tipo:TIPI.includes(d.tipo)?d.tipo:'Rosso',
    anno:d.anno||'',note:d.note||'',dos:d.dos||'',cht:d.cht||''
  }),80);
}

function mostraRisConsumo(d){
  const nome=(d.nome||'').toLowerCase();
  let best=null,bs=0;
  vini.forEach(w=>{
    let sc=0;
    const wn=(w.name||'').toLowerCase();
    nome.split(' ').forEach(p=>{if(p.length>2&&wn.includes(p))sc+=2;});
    wn.split(' ').forEach(p=>{if(p.length>2&&nome.includes(p))sc+=1;});
    if(d.cantina&&w.cantina&&w.cantina.toLowerCase().includes((d.cantina||'').toLowerCase().split(' ')[0]))sc+=2;
    if(d.anno&&w.anno&&Number(w.anno)===Number(d.anno))sc+=3;
    if(sc>bs){bs=sc;best=w;}
  });
  if(!best||bs<2){
    document.getElementById('cam-body').innerHTML=`
      <div class="err-box">⚠️ Vino non trovato in cantina. Verifica che sia stato inserito con lo stesso nome.</div>
      <button class="btn btn-ghost" style="width:100%;height:46px;font-size:14px;margin-top:8px" onclick="mostraPick()">← Riprova</button>`;
    return;
  }
  const qt=qq(best);
  window._consumeId=best.id;
  document.getElementById('cam-body').innerHTML=`
    <div class="result-box result-red">
      <div class="result-name">${best.name}</div>
      <div style="font-size:13px;color:var(--mu);margin-top:4px">${[best.cantina,best.regione,best.anno].filter(Boolean).join(' · ')}</div>
      <div style="font-size:14px;margin-top:10px">Quantità attuale: <strong>${qt}</strong> bottiglia${qt!==1?'e':''}</div>
      <div style="font-size:14px">Dopo il prelievo: <strong>${Math.max(0,qt-1)}</strong>${qt===1?' → verrà rimossa dalla cantina':''}</div>
    </div>
    <button class="btn btn-red" style="width:100%;height:48px;font-size:15px;margin-bottom:10px" onclick="confPrelievo()">🍾 Confermo il prelievo</button>
    <button class="btn btn-ghost" style="width:100%;height:42px;font-size:14px" onclick="mostraPick()">← Riprova</button>`;
}

function confPrelievo(){
  const id=window._consumeId;if(!id)return;
  const w=vini.find(x=>x.id===id);if(!w)return;
  const qt=qq(w);
  if(qt<=1)vini=vini.filter(x=>x.id!==id);
  else w.qty=qt-1;
  salva();aggStats();renderList();chiudiCam();
  toast('🍾 Bottiglia prelevata');
}

/* ── CHIAVE API (in fondo alla pagina) ── */
document.addEventListener('DOMContentLoaded',function(){
  init();
  // Aggiungi sezione chiave API in fondo
  const div=document.createElement('div');
  div.style.cssText='max-width:820px;margin:0 auto;padding:20px 14px;border-top:1px solid var(--bd)';
  div.innerHTML=`
    <div style="font-size:13px;font-weight:600;color:var(--mu);margin-bottom:8px">🔑 Chiave API (per lettura etichette)</div>
    <div style="font-size:12px;color:var(--mu);margin-bottom:8px">
      Necessaria per la fotocamera. Ottienila su
      <a href="https://console.anthropic.com" target="_blank" style="color:var(--pu)">console.anthropic.com</a>
      → API Keys → Create Key
    </div>
    <div style="display:flex;gap:8px">
      <input type="password" id="key-inp" placeholder="sk-ant-api03-…"
        style="flex:1;height:42px;padding:0 12px;border:1px solid var(--bd);border-radius:var(--rs);font-size:14px;font-family:monospace;background:var(--sur);outline:none">
      <button onclick="salvaKey()" style="height:42px;padding:0 16px;background:#c8a800;color:#fff;border:none;border-radius:var(--rs);font-size:14px;cursor:pointer;font-weight:600">Salva</button>
    </div>
    <div id="key-ok" style="font-size:12px;color:var(--gr);margin-top:6px;display:none">✅ Chiave attiva</div>`;
  document.body.appendChild(div);
  document.getElementById('inp-import').onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=function(ev){
      try{
        const d=JSON.parse(ev.target.result);
        if(d.vini&&Array.isArray(d.vini)){
          if(confirm('Importare '+d.vini.length+' bottiglie? I dati attuali verranno sostituiti.')){
            vini=d.vini;salva();aggStats();renderList();
            toast('✅ Importate '+vini.length+' bottiglie!');
          }
        }else alert('File non valido.');
      }catch(ex){alert('Errore: '+ex.message);}
    };
    r.readAsText(file);
    e.target.value='';
  };
  const k=localStorage.getItem('apiKey');
  if(k){
    setTimeout(()=>{
      const inp=document.getElementById('key-inp');
      const ok=document.getElementById('key-ok');
      if(inp)inp.value='(chiave salvata)';
      if(ok)ok.style.display='block';
    },100);
  }
});

function salvaKey(){
  const v=(document.getElementById('key-inp').value||'').trim();
  if(!v||v==='(chiave salvata)'){alert('Incolla prima la nuova chiave nel campo');return;}
  localStorage.setItem('apiKey',v);
  document.getElementById('key-inp').value='(chiave salvata)';
  document.getElementById('key-ok').style.display='block';
  toast('✅ Chiave API salvata!');
}
</script>
